name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          brew install ldid xz || true
          echo "--- versions ---"
          make --version | head -1
          xz --version | head -1
          ldid -v 2>&1 | head -1 || true

      - name: Setup Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "--- available SDKs ---"
          ls "$THEOS/sdks" || true

      - name: Build package
        run: |
          set -e
          make package FINALPACKAGE=1
          echo "--- artifacts ---"
          ls -la packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: FavoriteContacts-deb
          path: packages/*.deb
          if-no-files-found: error
