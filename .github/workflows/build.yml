name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          brew install ldid xz || true
          make --version | head -1

      - name: Setup Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls "$THEOS/sdks" || true

      - name: Build rootful
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p dist
          mv packages/*.deb dist/FavoriteContacts-rootful_2.0.1.deb

      - name: Build rootless
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb dist/FavoriteContacts-rootless_2.0.1.deb
          echo "--- artifacts ---"
          ls -la dist/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: FavoriteContacts-deb
          path: dist/*.deb
          if-no-files-found: error
